
   <!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Expediente Clínico | Sveltta Premium</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap');
        body { font-family: 'Montserrat', sans-serif; background-color: #f4f2f5; color: #111111; padding: 20px 10px; margin: 0; -webkit-font-smoothing: antialiased; }
        .lux-container { max-width: 800px; margin: auto; background: #ffffff; padding: 40px 25px; border-radius: 16px; box-shadow: 0 20px 50px rgba(74, 46, 78, 0.08); }
        @media(min-width: 768px) { .lux-container { padding: 60px 50px; } }
        .brand-header { text-align: center; margin-bottom: 40px; }
        .brand-title { font-size: 24px; font-weight: 600; letter-spacing: 4px; color: #000000; margin: 0; text-transform: uppercase; }
        .brand-subtitle { font-size: 14px; font-weight: 700; color: #e91e63; letter-spacing: 3px; margin-top: 5px; }
        .nom-tag { font-size: 10px; font-weight: 600; color: #555; letter-spacing: 2px; margin-top: 15px; }
        h2 { font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; color: #5d3a7d; border-bottom: 2px solid #eaeaea; padding-bottom: 10px; margin-top: 45px; margin-bottom: 25px; }
        .input-group { margin-bottom: 20px; position: relative; }
        .input-group label { display: block; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: #333333; margin-bottom: 5px; }
        .input-group input, .input-group textarea { width: 100%; border: none; border-bottom: 2px solid #d4c5d9; background: transparent; padding: 8px 0; font-size: 16px; font-weight: 600; color: #000000; font-family: 'Montserrat', sans-serif; transition: all 0.3s ease; border-radius: 0; }
        .input-group input:focus, .input-group textarea:focus { outline: none; border-bottom: 2px solid #e91e63; }
        .grid-2 { display: grid; grid-template-columns: 1fr; gap: 0 20px; }
        .grid-3 { display: grid; grid-template-columns: 1fr; gap: 0 20px; }
        @media(min-width: 600px) { .grid-2 { grid-template-columns: 1fr 1fr; } .grid-3 { grid-template-columns: 1fr 1fr 1fr; } }
        .tag-container { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 25px; margin-top: 10px; }
        .lux-check input { display: none; }
        .lux-check label { display: inline-block; border: 2px solid #d4c5d9; padding: 10px 18px; border-radius: 30px; font-size: 13px; color: #111111; font-weight: 600; cursor: pointer; transition: all 0.3s ease; background: #fff; }
        .lux-check input:checked + label { background: #5d3a7d; border-color: #5d3a7d; color: #fff; box-shadow: 0 4px 10px rgba(93, 58, 125, 0.3); }
        .measure-box { display: flex; align-items: flex-end; margin-bottom: 15px; border-bottom: 1px solid #e0e0e0; padding-bottom: 5px; }
        .measure-box label { width: 50%; font-size: 13px; font-weight: 600; color: #222222; text-transform: uppercase; letter-spacing: 1px; }
        .measure-box input { width: 35%; border: none; text-align: center; font-size: 17px; font-weight: 700; background: transparent; color: #5d3a7d; outline: none; }
        .measure-box span { width: 15%; font-size: 11px; font-weight: 600; color: #777; text-align: right; }
        .lux-alert { background: #fdf5f7; border: 2px solid #fce4e9; padding: 25px; border-radius: 8px; margin-top: 30px; }
        .lux-alert h2 { border: none; margin-top: 0; color: #d81b60; margin-bottom: 10px;}
        .alert-msg { font-size: 12px; font-weight: 700; color: #d81b60; text-transform: uppercase; letter-spacing: 1px; margin-top: 20px; display: flex; align-items: center; gap: 8px;}
        .policy-text { font-size: 13px; color: #222222; line-height: 1.8; font-weight: 500; }
        .policy-text ul { padding-left: 15px; }
        .policy-text li { margin-bottom: 10px; }
        .policy-highlight { font-weight: 700; color: #5d3a7d; }
        .policy-note-box { background: #eee8f0; border-left: 4px solid #5d3a7d; padding: 15px 20px; border-radius: 4px; margin-top: 15px; font-size: 13px; font-weight: 600; color: #444; }
        .signature-pad-wrapper { background: #fafafa; border: 2px solid #eaeaea; border-radius: 12px; padding: 20px; margin-top: 40px; text-align: center; }
        .signature-pad-wrapper h3 { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; color: #222222; margin-top: 0; margin-bottom: 20px; }
        .canvas-container { position: relative; background: #ffffff; border: 2px dashed #a08ba8; border-radius: 8px; margin-bottom: 15px; overflow: hidden; }
        canvas { width: 100%; height: 250px; cursor: crosshair; display: block; }
        .btn-clear { background: #e0e0e0; color: #333; border: none; padding: 10px 20px; border-radius: 20px; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; font-weight: 700; transition: 0.3s; }
        .btn-clear:hover { background: #d0d0d0; }
        .nutriologa-area { background-color: #fcfbfd; border: 2px solid #5d3a7d; border-radius: 16px; padding: 35px 25px; margin-top: 50px; position: relative; box-shadow: 0 10px 30px rgba(93, 58, 125, 0.05); }
        .nutriologa-badge { background: #5d3a7d; color: white; padding: 10px 20px; border-radius: 30px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; position: absolute; top: -18px; left: 50%; transform: translateX(-50%); white-space: nowrap; box-shadow: 0 4px 10px rgba(93, 58, 125, 0.3); }
        .btn-submit { background: #1a1a1a; color: white; border: none; width: 100%; padding: 20px; font-size: 15px; text-transform: uppercase; letter-spacing: 3px; font-weight: 600; border-radius: 8px; cursor: pointer; margin-top: 40px; transition: 0.3s; }
        .btn-submit:hover { background: #5d3a7d; box-shadow: 0 10px 20px rgba(93, 58, 125, 0.2); }
    </style>
</head>
<body>

    <div class="lux-container">
        <div class="brand-header">
            <h1 class="brand-title">Expediente Clínico</h1>
            <div class="brand-subtitle">SVELTTA VACU CENTER</div>
            <div class="nom-tag">CUMPLIMIENTO NOM-004-SSA3-2012</div>
        </div>

        <!-- AQUÍ ESTÁ EL CAMBIO IMPORTANTE EN ACTION -->
        <form action="/api/guardar-expediente" method="POST" id="formExpediente">
            <h2>I. Datos Generales</h2>
            <div class="grid-2">
                <div class="input-group"><label>Fecha</label><input type="date" name="fecha"></div>
                <div class="input-group"><label>Asesora</label><input type="text" name="asesora"></div>
            </div>
            <div class="input-group"><label>Nombre Completo de la Clienta</label><input type="text" name="nombre" required></div>
            <div class="grid-3">
                <div class="input-group"><label>F. de Nacimiento</label><input type="date" name="fecha_nacimiento"></div>
                <div class="input-group"><label>Edad</label><input type="number" name="edad"></div>
                <div class="input-group"><label>Teléfono</label><input type="tel" name="telefono"></div>
            </div>
            <!-- ... (resto del formulario igual) ... -->
            
            <button type="submit" class="btn-submit">Guardar Expediente Oficial</button>
        </form>
    </div>

    <script>
        // SCRIPT DE ENVÍO AUTOMÁTICO PARA QUE NO SEA PÁGINA BLANCA
        document.getElementById('formExpediente').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData.entries());
            
            try {
                const response = await fetch('/api/guardar-expediente', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(data)
                });
                const result = await response.json();
                alert(result.mensaje); // Te avisará cuando se guarde
            } catch (error) {
                alert("Error al guardar, intenta de nuevo.");
            }
        });
    </script>
</body>
</html>
